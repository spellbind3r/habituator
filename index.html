<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#374fcf" />
    <title>Habituator</title>
    <link rel="manifest" href="/public/manifest.webmanifest" />
    <link rel="stylesheet" href="src/ui/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Habituator</h1>
      <p class="subtitle">PWA-first daily logger MVP scaffold</p>
      <section class="card">
        <h2>Create tracker</h2>
        <label>
          What do you want to log?
          <input id="tracker-name" placeholder="Walk the dog" />
        </label>

        <label>
          Frequency
          <select id="frequency">
            <option value="hourly">Hourly</option>
            <option value="daily" selected>Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="specific_dates">Specific dates</option>
            <option value="as_needed">Whenever it occurs (no schedule)</option>
          </select>
        </label>

        <label>
          Value type
          <select id="value-type">
            <option value="binary" selected>Done / not done</option>
            <option value="keyword">Keyword</option>
            <option value="list">List select</option>
            <option value="time">Time</option>
          </select>
        </label>

        <label id="list-items-group" hidden>
          List items (comma or new line separated)
          <textarea id="list-items" rows="3" placeholder="Home cooked\nTakeaway\nSkipped"></textarea>
          <small class="muted">These become selectable options while logging.</small>
        </label>

        <label>
          Goals (comma separated)
          <input id="goals" placeholder="Improve sleep, reduce stress" />
        </label>

        <button id="create-tracker" type="button" disabled>
          Create tracker
        </button>
      </section>

      <section class="card">
        <h2>My trackers</h2>
        <ul id="tracker-list" class="tracker-list"></ul>
        <p id="empty-state" class="muted">No trackers yet. Add your first one above.</p>
      </section>

      <section class="card">
        <h2>Log now</h2>
        <ul id="logger-list" class="tracker-list"></ul>
        <p id="logger-empty-state" class="muted">Create trackers to start logging.</p>
      </section>

      <section class="card">
        <h2>Recent log events</h2>
        <ul id="log-list" class="tracker-list"></ul>
        <p id="log-empty-state" class="muted">No log events yet.</p>
      </section>
    </main>

    <script type="module" src="src/ui/app.js"></script>
  </body>
</html>
